<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StarShooter">
  <!--
    A four-cell matrix: the past-paper grid the app is built around, with one
    cell picked out in gold — the paper you are working toward. Four shapes
    survive being scaled to a 16px favicon, where finer detail turns to mud.
  -->
  <rect width="64" height="64" rx="14" fill="#10574b"/>
  <rect x="15" y="15" width="14" height="14" rx="3" fill="#f8f6f1"/>
  <rect x="35" y="15" width="14" height="14" rx="3" fill="#f8f6f1"/>
  <rect x="15" y="35" width="14" height="14" rx="3" fill="#f8f6f1"/>
  <rect x="35" y="35" width="14" height="14" rx="3" fill="#e0c383"/>
</svg>
