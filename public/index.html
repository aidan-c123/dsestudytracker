<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="StarShooter — a calm, private study desk for HKDSE candidates: past paper matrix, focus timer, SBA deadlines and a live exam countdown." />
    <title>StarShooter — HKDSE Study Desk</title>
    <link rel="preload" href="/fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StarShooter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      /* Paint the remembered theme before the first frame. Without this a
         dark-mode phone flashes the light page on every load. It lives inline
         because a separate file would arrive too late to help. */
      try {
        var t = localStorage.getItem('starshooter-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root" class="boot">
      <img class="boot-mark" src="/logo.svg" alt="" width="52" height="52" />
      <p class="boot-text">Opening your desk…</p>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
